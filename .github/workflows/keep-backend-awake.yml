# Render's free plan stops the backend after ~15 minutes without traffic, which also
# pauses the background job refresh. Pinging the health check keeps it running so new
# openings keep arriving. (GitHub may delay scheduled runs by a few minutes.)
# Set the repository variable BACKEND_HEALTH_URL (Settings → Secrets and variables →
# Actions → Variables) to the backend's /health URL; the job does nothing until it's set.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health check
        if: ${{ vars.BACKEND_HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 "$HEALTH_URL"
